name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pine script sanity
        run: |
          shopt -s nullglob
          files=(*.pine src/*.pine)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .pine file found (repo root or src/)"; exit 1
          fi
          for f in "${files[@]}"; do
            grep -Eq '^\s*//@version=[0-9]+' "$f" || { echo "::error file=$f::Missing //@version=N header"; exit 1; }
            grep -Eq '^\s*(indicator|strategy)\(' "$f" || { echo "::error file=$f::Missing indicator()/strategy() declaration"; exit 1; }
          done

      - name: CHANGELOG must be updated
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "::error::Every PR must add an entry to CHANGELOG.md"; exit 1
          fi

      - name: Release rules (only if PR has the release label)
        if: contains(github.event.pull_request.labels.*.name, 'release')
        run: |
          # Version = first "## [x.y.z]" heading in CHANGELOG (below [Unreleased])
          version=$(grep -Eo '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')
          [ -n "$version" ] || { echo "::error::Release PR needs a '## [x.y.z] - YYYY-MM-DD' section in CHANGELOG.md"; exit 1; }
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists - bump the version"; exit 1
          fi
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::error::Version $version must be greater than latest release $latest"; exit 1
          fi
          notes=$(bash scripts/changelog_notes.sh "$version" | tr -d '[:space:]')
          [ -n "$notes" ] || { echo "::error::CHANGELOG section for $version is empty"; exit 1; }
          echo "OK: will release v$version on merge"
