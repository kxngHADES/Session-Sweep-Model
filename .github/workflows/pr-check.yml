name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pine script sanity
        run: |
          shopt -s nullglob
          files=(*.pine src/*.pine)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .pine file found (repo root or src/)"; exit 1
          fi
          for f in "${files[@]}"; do
            grep -Eq '^\s*//@version=[0-9]+' "$f" || { echo "::error file=$f::Missing //@version=N header"; exit 1; }
            grep -Eq '^\s*(indicator|strategy)\(' "$f" || { echo "::error file=$f::Missing indicator()/strategy() declaration"; exit 1; }
          done

      - name: Version marker must exist
        run: |
          grep -q 'x-release-please-version' session-sweep.pine || { echo "::error::session-sweep.pine lost its x-release-please-version marker"; exit 1; }
