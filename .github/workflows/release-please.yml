name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only when the release PR was merged: build and attach the assets.
      - uses: actions/checkout@v4
        if: ${{ steps.rp.outputs.release_created }}

      - name: Package and upload assets
        if: ${{ steps.rp.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          mkdir dist
          cp session-sweep.pine LICENSE CHANGELOG.md dist/
          (cd dist && zip -r "../session-sweep-${TAG}.zip" .)
          gh release upload "$TAG" session-sweep.pine "session-sweep-${TAG}.zip" --clobber
