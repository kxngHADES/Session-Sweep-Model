name: PR Title

# PRs are squash-merged, so the PR title becomes the commit that
# release-please reads to decide the next version and changelog entry.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            ci
            build
            test
            revert
          requireScope: false
