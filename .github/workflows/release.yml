name: Release

# Runs only when a PR carrying the 'release' label is MERGED into main.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read version and notes from CHANGELOG
        id: v
        run: |
          version=$(grep -Eo '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')
          [ -n "$version" ] || { echo "::error::No versioned CHANGELOG section"; exit 1; }
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          bash scripts/changelog_notes.sh "$version" > release_notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package Pine script(s)
        run: |
          shopt -s nullglob
          mkdir dist
          cp *.pine src/*.pine dist/ 2>/dev/null || true
          cp LICENSE CHANGELOG.md dist/
          (cd dist && zip -r "../session-sweep-v${{ steps.v.outputs.version }}.zip" .)

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.v.outputs.version }}"
          gh release create "$v" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$v" \
            --notes-file release_notes.md \
            dist/*.pine "session-sweep-$v.zip"
